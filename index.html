<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мяу-мяу-мяу</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="none">

<section id="screen-code" class="screen center">
  <div class="card">
    <img class="hero" src="img/login.png" alt="">
    <h1>Мяу-мяу-мяу</h1>
    <p class="muted">Введи свой номерок</p>
    <form id="code-form">
      <input id="code-input" placeholder="xxxxx-xxxxx" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn" type="submit">Войти</button>
    </form>
    <p id="code-error" class="error" hidden></p>
  </div>
</section>

<div id="screen-app" hidden>
  <header>
    <button class="profile" id="profile" title="Выйти">
      <img id="me-avatar" alt=""><span id="me-name"></span>
    </button>
    <nav id="tabs"></nav>
  </header>
  <main id="content"></main>
</div>

<script src="https://www.youtube.com/iframe_api" async></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
